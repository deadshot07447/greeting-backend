version: '3.8'

services:
  app:
    image: greeting-backend:${ENV_TAG}
    container_name: greeting-backend-${ENV_TAG}
    ports:
      - "${APP_PORT}:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=greeting_db
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: greeting-db-${ENV_TAG}
    ports:
      - "${DB_PORT}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=greeting_db
    volumes:
      - ./database.sql:/docker-entrypoint-initdb.d/01-database.sql
      - ./${ENV_TAG}.sql:/docker-entrypoint-initdb.d/02-env.sql
